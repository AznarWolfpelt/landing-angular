<section class="escena-3d-container">
  <!-- Controles superiores -->
  <div class="controles-superiores">
    <button
      (click)="toggleRotation()"
      class="btn-control"
      [class.btn-activo]="rotando"
    >
      <i class="bi" [class.bi-pause]="rotando" [class.bi-play]="!rotando"></i>
      {{ rotando ? 'Pausar Rotación' : 'Iniciar Rotación' }}
    </button>

    <button
      (click)="cambiarColor()"
      class="btn-control btn-color"
    >
      <i class="bi bi-palette"></i>
      Cambiar Color
    </button>

    <!-- ✅ NUEVO: Botón para resetear vista -->
    <button
      (click)="resetearVista()"
      class="btn-control btn-reset"
    >
      <i class="bi bi-arrow-clockwise"></i>
      Resetear Vista
    </button>
  </div>

  <!-- Contenedor del renderer -->
  <div
    #rendererContainer
    class="renderer-container"
  ></div>

  <!-- Información inferior -->
  <div class="info-inferior">
    <p class="instrucciones">
      <i class="bi bi-arrows-move"></i>
      Arrastra para rotar • 
      <i class="bi bi-mouse"></i>
      Rueda para zoom •
      <i class="bi bi-arrow-clockwise"></i>
      Reset para vista inicial
    </p>
  </div>
</section>
