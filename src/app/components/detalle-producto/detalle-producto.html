<div class="detalle-container">
  <!-- ... código anterior ... -->
  
  <div *ngIf="!cargando && producto" class="detalle-content">
    <div class="row">
      <!-- Columna de imagen/3D -->
      <div class="col-md-6">
        <div class="vista-container">
          
          <!-- Botón para alternar vista -->
          <div class="vista-controls">
            <button (click)="alternarVista()" class="btn-vista-toggle">
              <i class="bi" [class.bi-cube]="vistaActiva === 'imagen'" [class.bi-image]="vistaActiva === 'modelo3d'"></i>
              {{ vistaActiva === 'imagen' ? 'Ver en 3D' : 'Ver Imagen 2D' }}
            </button>
          </div>

          <!-- Vista de Imagen -->
          <div *ngIf="vistaActiva === 'imagen'" class="vista-imagen">
            <img [src]="producto.imagen || 'https://picsum.photos/500/400'" 
                 [alt]="producto.nombre"
                 class="producto-imagen">
          </div>
          
          <!-- Vista 3D -->
          <div *ngIf="vistaActiva === 'modelo3d'" class="vista-3d">
            <app-escena3d [modeloUrl]="producto.modelo_3d_url"></app-escena3d>
          </div>
        </div>
      </div>

      <!-- Columna de información -->
      <div class="col-md-6">
        <div class="producto-info">
          <div class="categoria-badge">{{ producto.categoria || 'General' }}</div>
          <h1 class="producto-titulo">{{ producto.nombre }}</h1>
          <p class="producto-descripcion" *ngIf="producto.descripcion">
            {{ producto.descripcion }}
          </p>
          
          <div class="precio-section">
            <span class="precio">${{ producto.precio }}</span>
            <span *ngIf="producto.stock" class="stock-disponible">
              {{ producto.stock }} disponibles
            </span>
          </div>

          <div class="acciones-section">
            <button class="btn-agregar-carrito" (click)="agregarAlCarrito()">
              Agregar al Carrito
            </button>
            <button class="btn-comprar-ahora">
              Comprar Ahora
            </button>
          </div>

          <!-- Indicador de vista 3D disponible -->
          <div *ngIf="producto.modelo_3d_url" class="alert alert-info mt-3">
            <i class="bi bi-info-circle me-2"></i>
            Este producto tiene vista 3D disponible
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!cargando && !producto" class="error-producto">
    <h2>Producto no encontrado</h2>
    <p>El producto que buscas no existe o no está disponible.</p>
  </div>
</div>
