<div class="detalle-container">
  <div *ngIf="cargando" class="cargando">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Cargando producto...</p>
  </div>

  <div *ngIf="!cargando && producto" class="detalle-content">
    <div class="row">
      <!-- Columna de imagen/3D -->
      <div class="col-md-6">
        <div class="imagen-section">
          <img [src]="producto.imagen || 'https://picsum.photos/500/400'" 
               [alt]="producto.nombre"
               class="producto-imagen">
        </div>
        
        <!-- Aquí integras tu Three.js -->
        <div class="threejs-section mt-4">
          <h4>Vista 3D del Producto</h4>
          <app-escena3d></app-escena3d>
        </div>
      </div>

      <!-- Columna de información -->
      <div class="col-md-6">
        <div class="producto-info">
          <div class="categoria-badge">{{ producto.categoria || 'General' }}</div>
          <h1 class="producto-titulo">{{ producto.nombre }}</h1>
          <p class="producto-descripcion" *ngIf="producto.descripcion">
            {{ producto.descripcion }}
          </p>
          
          <div class="precio-section">
            <span class="precio">${{ producto.precio }}</span>
            <span *ngIf="producto.stock" class="stock-disponible">
              {{ producto.stock }} disponibles
            </span>
          </div>

          <div class="acciones-section">
            <button class="btn-agregar-carrito" (click)="agregarAlCarrito()">
              Agregar al Carrito
            </button>
            <button class="btn-comprar-ahora">
              Comprar Ahora
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!cargando && !producto" class="error-producto">
    <h2>Producto no encontrado</h2>
    <p>El producto que buscas no existe o no está disponible.</p>
  </div>
</div>
