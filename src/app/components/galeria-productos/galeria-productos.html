<div class="galeria-container">
  <div class="galeria-header">
    <h1>Descubre Nuestros Productos</h1>
    <p class="text-muted">Encuentra lo que necesitas con la mejor calidad</p>
  </div>

  <div *ngIf="productos.length === 0" class="cargando">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Cargando productos...</p>
  </div>

  <div class="galeria-grid">
    <div *ngFor="let producto of productos" class="producto-card">
      <div class="producto-imagen">
        <img [src]="producto.imagen || 'https://picsum.photos/300/200'" 
             [alt]="producto.nombre"
             loading="lazy">
      </div>
      
      <div class="producto-info">
        <div class="producto-categoria">{{ producto.categoria || 'General' }}</div>
        <h3 class="producto-nombre">{{ producto.nombre }}</h3>
        <div class="producto-precio">${{ producto.precio }}</div>
        <!-- En la tarjeta de producto, cambiar el botón: -->
        <button class="btn-agregar" (click)="verDetalle(producto.id)">
          Ver Detalle
        </button>
      </div>
    </div>
  </div>
</div>
